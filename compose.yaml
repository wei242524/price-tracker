services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: price_tracker
      POSTGRES_PASSWORD: price_tracker
      POSTGRES_DB: price_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_tracker -d price_tracker"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://price_tracker:price_tracker@db:5432/price_tracker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  
volumes:
  postgres_data:
