name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: price_tracker
          POSTGRES_PASSWORD: price_tracker
          POSTGRES_DB: price_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U price_tracker -d price_tracker"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Check migrations
        env:
          DATABASE_URL: postgresql+psycopg://price_tracker:price_tracker@localhost:5432/price_tracker
        run: |
          python -m alembic upgrade head
          python -m alembic check

      
